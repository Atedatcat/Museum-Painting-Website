<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIPE CYCLE WEB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Turret+Road:wght@200;300;400;500;700;800&display=swap" rel="stylesheet">

  <style>

html {
    height: 100%;
}


body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(to bottom, #3B2B2C, #4D3A36, #211D1D) fixed;
    position: relative;
}

h1 {
    color: white;
    text-align: center;
    font-size: 50px;
    font-family: "Turret Road";

}

.tv-wall {
        width: fit-content;
        margin: 100px auto 0;
    }

.tv-container {
        display: grid;
        grid-template-columns: repeat(3, 250px);
        grid-template-rows: repeat(3, 250px);
        gap: 8px;
    }

.tv-container > div {
        background: #8CC8BD;
        width: 250px;
        height: 250px;
        border: 15px solid black;
        box-sizing: border-box;
        
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer; 
    
    }

.screen {
        background: #97CAF7;
        width: 230px;
        height: 60px;
        margin-top: 165px;
    }

.tv-container > div:hover {
        background: #5F5A6E; 
    }

.tv-container > div:hover .screen {
        background: #523F33; 
    }
  </style>
</head>


<body>

<h1>WIPE CYCLE</h1>

<div class="tv-wall">
    <div class="tv-container">
        <div class="tv1"><div class="screen"></div></div>
        <div class="tv2"><div class="screen"></div></div>
        <div class="tv3"><div class="screen"></div></div>

        <div class="tv4"><div class="screen"></div></div>
        <div class="tv5"><div class="screen"></div></div>
        <div class="tv6"><div class="screen"></div></div>

        <div class="tv7"><div class="screen"></div></div>
        <div class="tv8"><div class="screen"></div></div>
        <div class="tv9"><div class="screen"></div></div>
    </div>
</div>
    
</body>

</html>
