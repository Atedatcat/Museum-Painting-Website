<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIPE CYCLE WEB</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Turret+Road:wght@200;300;400;500;700;800&display=swap" rel="stylesheet">

  <style>

html {
    height: 100%;
}


body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(to bottom, rgb(26, 25, 25), #3B2B2C, #4D3A36, #211D1D) fixed;
    position: relative;
}

h1 {
    color: white;
    text-align: center;
    font-size: 50px;
    font-family: "Turret Road";

}

.tv-wall {
        width: fit-content;
        margin: 100px auto 0;
    }

.tv-container {
        display: grid;
        grid-template-columns: repeat(3, 250px);
        grid-template-rows: repeat(3, 250px);
        gap: 8px;
    }

.tv-container > div {
    background: black;
    width: 250px;
    height: 250px;
    border: 15px solid black;
    box-sizing: border-box;
    overflow: hidden;
    cursor: pointer;
}

.tv-container > div video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.8) contrast(1.1);
}

#camera-feed {
    transform: scaleX(-1);
}

.tv-container > div {
    position: relative;
}

.tv-container > div:not(.tv5):hover video{
    filter: brightness(0.08) saturate(0);
    transition: filter 0.2 ease;
}

.click-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    background: rgba(0, 0, 0, 0.45);

    font-family: "Turret Road", sans-serif;
    font-size: 28px;
    text-align: center;

    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
}

.tv5:hover .click-overlay {
    opacity: 1;
}

.tv5.camera-active .click-overlay {
    display: none;
}

.static-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;

    background-image: url("staticscreen.gif");
    background-size: cover;
    background-position: center;

    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}

.tv-container > div:not(.tv5):hover .static-overlay {
    opacity: 1;
}

  </style>
</head>


<body>

<h1>WIPE CYCLE</h1>

<div class="tv-wall">
    <div class="tv-container">
        <div class="tv1">
            <video autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>
            <div class="static-overlay"></div>
        </div>

        <div class="tv2">
            <video autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>
            <div class="static-overlay"></div>
        </div>

        <div class="tv3">
           <video autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>
            <div class="static-overlay"></div>
        </div>

        <div class="tv4">
            <video autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>
            <div class="static-overlay"></div>
        </div>

        <div class="tv5">
            <video id="camera-feed" autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>

            <div class="click-overlay">
                CLICK ME
            </div>
        </div>  

        <div class="tv6">
            <video autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>
            <div class="static-overlay"></div>
        </div>

        <div class="tv7">
            <video autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>
            <div class="static-overlay"></div>
        </div>

        <div class="tv8">
            <video autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>
            <div class="static-overlay"></div>
        </div>

        <div class="tv9">
            <video autoplay muted loop playsinline>
                <source src="clip1.mp4" type="video/mp4">
            </video>
            <div class="static-overlay"></div>
        </div>

    </div>
</div>

<script>
    const cameraTV = document.querySelector(".tv5");
    const cameraFeed = document.getElementById("camera-feed");

    let cameraStream = null;

    cameraTV.addEventListener("click", async () => {
        // Don't request permission again if the camera is running
        if (cameraStream) {
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "user"
                },
                audio: false
            });

            // Save the camera stream
            cameraStream = stream;

            // Replace the prerecorded video with the live camera
            cameraFeed.srcObject = cameraStream;

            // Remove the looping behavior for the live feed
            cameraFeed.loop = false;

            await cameraFeed.play();
            cameraTV.classList.add("camera-active");

        } catch (error) {
            console.error("Camera access failed:", error);

            // Keep the original video playing if permission is denied
            cameraFeed.srcObject = null;
            cameraStream = null;
        }
    });
</script>

</body>
</html>
