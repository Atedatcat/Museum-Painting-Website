<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIPE CYCLE WEB</title>
  <style>
    body {
        margin: 0;
        background-attachment: fixed;
        background: linear-gradient(to bottom, #3B2B2C, #4D3A36, #211D1D);
        position: relative;
    }

.tv-container {
    display: grid;
    grid-template-columns: repeat(3, 250px);
    grid-template-rows: repeat(3, 250px);
    gap: 8px;
    justify-content: center;
    margin-top: 100px;
}

.tv-container div {
    background: black;
    width: 250px;
    height: 250px;
}

.tv__screen {
    display: inline-block;
    background: green;
}

  </style>
</head>

<body>

    <div class="tv-container">
        <div class="tv1"></div>
            <span class="tv__screen"></span>
        <div class="tv2"></div>
        <div class="tv3"></div>

        <div class="tv4"></div>
        <div class="tv5"></div>
        <div class="tv6"></div>

        <div class="tv7"></div>
        <div class="tv8"></div>
        <div class="tv9"></div>
    </div>
    
    
    
</body>

  </html>
